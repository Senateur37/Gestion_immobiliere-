<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supprimer {{ property.name }} | ImmoPilot</title><style>body{align-items:center;background:#f5f7f9;color:#152536;display:flex;font-family:system-ui,sans-serif;justify-content:center;margin:0;min-height:100vh;padding:20px}.box{background:#fff;border:1px solid #e3e9ed;border-radius:8px;max-width:480px;padding:32px;text-align:center;width:100%}.box p{color:#71808d}.actions{display:flex;gap:10px;justify-content:center;margin-top:25px}a,button{border:1px solid #e3e9ed;border-radius:6px;font:inherit;font-weight:700;padding:12px 16px;text-decoration:none}button{background:#b4534b;border:0;color:#fff;cursor:pointer}</style></head><body><main class="box"><h1>Supprimer ce bien ?</h1><p>« {{ property.name }} » sera définitivement supprimé ainsi que ses unités associées.</p><form class="actions" method="post">{% csrf_token %}<a href="{% url 'property_list' %}">Annuler</a><button type="submit">Confirmer la suppression</button></form></main></body></html>
