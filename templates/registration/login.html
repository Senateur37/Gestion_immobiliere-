<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion | ImmoPilot</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #152536; --navy:#0d1d2c; --navy-2:#183b57; --teal:#0f9c95; --teal-strong:#0b7a73; --bg:#edf4f7; }
    * { box-sizing: border-box; }
    body { align-items: center; background: radial-gradient(circle at top left, rgba(16,156,149,.18), transparent 28%), linear-gradient(135deg,#edf4f7,#dfeaf3); display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
    .login { background: rgba(255,255,255,.9); border: 1px solid rgba(13,29,44,.08); border-radius: 22px; box-shadow: 0 28px 65px rgba(11,29,44,.14); max-width: 440px; padding: 38px 34px; width: 100%; backdrop-filter: blur(12px); }
    .brand { color: var(--navy); font-size: 1.28rem; font-weight: 900; letter-spacing: .02em; }
    .brand span { color: var(--teal); }
    .eyebrow { color: var(--teal-strong); font-size: .72rem; font-weight: 800; letter-spacing: .14em; margin-top: 42px; text-transform: uppercase; }
    h1 { font-size: 2.2rem; letter-spacing: -.05em; margin: 10px 0; }
    .intro { color: #617286; font-size: .92rem; margin: 0 0 28px; line-height: 1.55; }
    form p { margin: 0 0 18px; }
    label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: 7px; }
    input { background: #f9fbfc; border: 1px solid #d9e3eb; border-radius: 10px; font: inherit; padding: 12px 13px; width: 100%; }
    input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(15,156,149,.12); outline: 0; }
    .errorlist { color: #b95d46; font-size: .8rem; list-style: none; padding: 0; }
    button { background: linear-gradient(135deg,var(--teal) 0%,var(--teal-strong) 100%); border: 0; border-radius: 10px; color: white; cursor: pointer; font: inherit; font-weight: 800; margin-top: 8px; padding: 14px; width: 100%; box-shadow: 0 16px 26px rgba(15,156,149,.18); }
    button:hover { filter: brightness(1.02); }
    @media (max-width: 480px) { .login { padding: 30px 24px; } .eyebrow { margin-top: 34px; } }
  </style>
</head>
<body><main class="login">
  <div class="brand">Immo<span>Pilot</span></div>
  <div class="eyebrow">Espace sécurisé</div>
  <h1>Bienvenue</h1>
  <p class="intro">Connectez-vous pour piloter votre patrimoine immobilier avec une vue claire et premium.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Accéder à mon espace</button>{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}</form>
</main>
</body>
</html>
